<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>Painel Administrativo</title>

    <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- MENU -->
        <div class="col-sm-2 sidebar">

            <h4>Painel Administrativo</h4>

            <ul class="nav nav-pills nav-stacked">

                <li><a href="#"><span class="glyphicon glyphicon-folder-open"></span> Categorias</a></li>

                <li><a href="#"><span class="glyphicon glyphicon-pencil"></span> Postagens</a></li>

                <li><a href="#"><span class="glyphicon glyphicon-user"></span> Usuários</a></li>

                <li><a href="#"><span class="glyphicon glyphicon-log-out"></span> Sair do Sistema</a></li>

            </ul>

        </div>

        <!-- CONTEÚDO -->

        <div class="col-sm-10">

            <h1>Título da Página</h1>

            <div class="panel panel-default">

                <div class="panel-heading">
                    Título da página
                </div>

                <div class="panel-body">

                    <form>

                        <div class="form-group">

                            <label>Título</label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Entre com o texto">

                        </div>

                        <div class="form-group">

                            <label>Foto Destaque</label>

                            <input type="file">

                        </div>

                        <div class="form-group">

                            <label>Conteúdo</label>

                            <textarea
                                class="form-control"
                                rows="6"></textarea>

                        </div>

                        <div class="form-group">

                            <label>Selects</label>

                            <select class="form-control">

                                <option>1</option>
                                <option>2</option>
                                <option>3</option>

                            </select>

                        </div>

                        <button class="btn btn-default">
                            Cadastrar
                        </button>

                        <button type="reset" class="btn btn-default">
                            Limpar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>
</html>
